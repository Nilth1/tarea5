<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <header class="header">
    <div class="header-container">

        <div class="logo">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcS3UHFeCzJT7LYbctD10N7MmuOy7IVX8U9qUw&s" alt="logo">
        </div>

        <div class="textos">
            <a href="../../index.html">INDEX</a>
            <a href="contacto.html">CONTACTO</a>
            <a href="https://www.youtube.com/@mcdonalds_uy" target="_blank">YOUTUBE</a>
        </div>

    </div>
</header>
<main class="main-contacto">
    <h2 class="titulo-form">FORMULARIO</h2>
    <div class="formulario-container">
        
        <form class="mi-formulario">
            <div class="casilla">
                <label for="tel">Telefono</label>
                <input type="number" id="tel" placeholder="tu numero" required>
            </div>

            <div class="casilla">
                <label for="nombre">Nombre</label>
                <input type="text" id="nombre" pattern="[A-Za-z ]+" placeholder="tu nombre" required>
            </div>

            <div class="casilla">
                <label for="genero">Genero</label>
                <select id="genero" required>
                    <option value="" disabled selected>Selecciona una opcion</option>
                    <option value="hombre">Hombre</option>
                    <option value="mujer">Mujer</option>
                    <option value="otro">Otro</option>
                </select>
            </div>

            <div class="contenedor-boton">
                <button type="submit" class="boton-enviar">ENVIAR</button>
            </div>
        </form>
    </div>
</main>
<footer class="footer">
    <div class="footer-container">
        <img src="https://i.postimg.cc/CLTYX9FX/image.png" alt="Footer Logo">
    </div>
</footer>
</body>
</html>
